<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Livraria</title>

    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <div class="container">
      <header>
        <h1>Sistema de Livraria</h1>
      </header>

      <section class="form-section">
        <h2>Novo Livro</h2>

        <div class="form-group">
          <input type="text" id="titulo" placeholder="Título do Livro" />

          <input type="text" id="autor" placeholder="Autor" />

          <input type="number" id="preco" placeholder="Preço" />

          <button id="btnAdicionar">Adicionar Livro</button>
        </div>
      </section>

      <section class="lista-section">
        <h2>Lista de Livros</h2>
        <div id="lista" class="lista-livros"></div>
      </section>
    </div>

    <script type="module" src="js/livros.js"></script>
  </body>
</html>
