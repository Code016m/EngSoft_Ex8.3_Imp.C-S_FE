<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Livraria</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Sistema de Livraria</h1>
    <div class="form">
        <label for="titulo"></label><input type="text" id="titulo" placeholder="Título do livro">
        <label for="autor"></label><input type="text" id="autor" placeholder="Autor">
        <label for="preco"></label><input type="number" id="preco" placeholder="Preço">
        <button onclick="adicionarLivro()">Adicionar</button>
    </div>

    <h2>Lista de Livros</h2>

    <ul id="lista"></ul>

    <script src="script.js"></script>

</body>
</html>
